name: Sync Spreadsheet & Deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    # 毎日 0:00 UTC (9:00 JST) と 12:00 UTC (21:00 JST) に自動バックアップ
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest spreadsheet data
        run: python3 scripts/sync_data.py

      - name: Commit and push snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/applications.csv data/applications.json
          if git diff --cached --quiet; then
            echo "No changes in spreadsheet data."
          else
            git commit -m "chore: auto-sync marche applications snapshot"
            git push
          fi

  deploy-pages:
    needs: sync-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
